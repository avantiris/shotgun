[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sg-core = { path = "crates/sg-core" }
sg-export = { path = "crates/sg-export" }
sg-audio = { path = "crates/sg-audio" }
sg-media = { path = "crates/sg-media" }
sg-play = { path = "crates/sg-play" }
sg-render = { path = "crates/sg-render" }
sg-project = { path = "crates/sg-project" }
sg-ui = { path = "crates/sg-ui" }

anyhow = "1"
blake3 = { version = "1", features = ["rayon"] }
bytemuck = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
# Versions fixed by spike S2 (docs/spikes/s2-ui.md).
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
log = "0.4"
png = "0.18"
pollster = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
ureq = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
# Stylistic; `chunks_exact` reads fine where the size is not a type-level fact.
chunks_exact_to_as_chunks = "allow"
# Judged case by case in review rather than by count.
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
debug = "line-tables-only"
codegen-units = 16
