<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232427"/>
      <stop offset="1" stop-color="#09090a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d6da"/>
    </linearGradient>
    <radialGradient id="bore" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#1c1d20"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- The muzzle of a double-barrelled shotgun, seen from the front: two bores in one face. -->
  <rect x="72" y="158" width="368" height="196" rx="98" fill="url(#face)"/>
  <circle cx="170" cy="256" r="68" fill="url(#bore)"/>
  <circle cx="342" cy="256" r="68" fill="url(#bore)"/>
