[package]
name = "sg-audio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
crossbeam-channel.workspace = true
libc = "0.2"
log.workspace = true
# Versions and features fixed by spike S3 (docs/spikes/s3-audio.md).
pipewire = { version = "0.10.1", features = ["v1_2_0"] }
nnnoiseless = { version = "0.5", default-features = false }
rtrb = "0.4.1"
# The spectrum behind the equaliser's curve (already in the tree through sg-media).
rustfft = "6"
# The ALSA sequencer, for MIDI keyboards.
alsa = "0.11"
# One call to RTKit for the priority of the thread that feeds the rings
# (already in the tree through the file picker).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
sg-plug = { path = "../sg-plug" }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
