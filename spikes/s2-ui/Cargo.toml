[package]
name = "s2-ui"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "s2-ui"

[workspace]

[dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
libc = "0.2"
raw-window-handle = "0.6"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
glyphon = "0.12"

[profile.release]
opt-level = 3
debug = 1
