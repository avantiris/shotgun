[package]
name = "s1-decode"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "s1"
path = "src/main.rs"

[dependencies]
ffmpeg-next = "9.1.0"
wgpu = "30.0.2"
ash = "0.38"
winit = "0.30"
pollster = "0.4"
libc = "0.2"
bytemuck = "1"

[profile.release]
debug = 1

[workspace]
exclude = ["bindings-test"]
